services:

  backend:
    build:
      context: ./Backend/app
    container_name: nest-backend

    ports:
      - "3000:3000"

    restart: unless-stopped

    environment:
      PORT: "3000"
      # Must live inside the sqlite_data volume (/app/data) to persist.
      DB_PATH: /app/data/data.sqlite
      UPLOAD_DIR: /app/uploads
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
      # Swagger stays reachable at http://localhost:3000/api in Compose.
      SWAGGER_ENABLED: "true"
      # Required. Set it in a .env file next to this one (never commit it):
      #   JWT_SECRET=<output of: openssl rand -hex 32>
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -hex 32)}

    volumes:
      - sqlite_data:/app/data
      - uploads_data:/app/uploads

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: cloudflare-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://backend:3000
    depends_on:
      - backend

  frontend:
    build:
      context: ./Frontend
      args:
        BUILD_CONFIGURATION: docker
    container_name: angular-frontend

    ports:
      - "4200:80"

    restart: unless-stopped

    depends_on:
      - backend

volumes:
  sqlite_data:
  uploads_data:
